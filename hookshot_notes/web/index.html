<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b140c">
  <title>Hookshot Notes</title>
  <link rel="stylesheet" href="/web/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div id="map"></div>

  <button id="banner" class="banner" aria-haspopup="true" aria-controls="zones" title="Choisir un lieu">
    <span class="fill"></span><span class="line"></span>
    <span class="name" id="zone-name">Hookshot Notes</span>
  </button>
  <div id="percent" class="percent"></div>

  <div id="counters" class="counters"></div>

  <div id="status" class="status" hidden></div>

  <div id="floors" class="floors" hidden></div>

  <button id="recenter" class="fab" title="Recentrer sur Link" aria-label="Recentrer sur Link"><i></i></button>
  <button id="mode" class="mode" aria-pressed="false"></button>

  <div id="chips" class="chips" role="group" aria-label="Filtres"></div>

  <div id="zones" class="zones" hidden>
    <div class="zones-head"><span>Lieux visités</span><button id="zones-close" aria-label="Fermer">✕</button></div>
    <div class="deco"></div>
    <ul id="zone-list"></ul>
  </div>

  <div id="qr" class="qr" hidden>
    <div class="qr-title">Sur ton téléphone</div>
    <div id="qr-code"></div>
    <div id="qr-url" class="qr-url"></div>
    <button id="qr-close">OK</button>
  </div>

  <script src="/web/vendor/leaflet/leaflet.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
